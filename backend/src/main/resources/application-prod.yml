spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:/var/staffcore33/uploads}

logging:
  level:
    root: WARN
    com.staffcore33.ats: INFO
